<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=960" />
<title>IMG_1843 token charts</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* top half of the RPN split (1080x960), drawn in the reel's own kit: mint accent, pixel type, dark dot floor.
     Scene A (0-13.8 s) = token budget bars, scene B (13.8-25.0 s) = no-limit grid -> NVIDIA.
     Companies he names start blurred and sharpen on the word; companies he never names stay blurred. */
  @font-face { font-family: Px; src: url(assets/fonts/PixelifySans.ttf); font-weight: 400 700; }
  @font-face { font-family: Vt; src: url(assets/fonts/VT323.ttf); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 960px; overflow: hidden; background: #070E0B; }
  :root { --acc: #3DF5A0; --ink: #F6FCF8; --dim: #8AA698; --card: #14221C; --line: #32503F; --bg: #070E0B; }
  #root { position: relative; width: 1080px; height: 960px; overflow: hidden; color: var(--ink); font-family: Px, monospace; }
  .clip { position: absolute; inset: 0; }
  #floor { background: url(assets/floor.png) 0 0 / 1080px 960px; }
  .abs { position: absolute; }
  .hd { left: 0; right: 0; text-align: center; font-weight: 700; font-size: 58px; letter-spacing: 3px; }
  .sub { left: 0; right: 0; text-align: center; font-size: 30px; color: var(--dim); letter-spacing: 3px; }
  .src { left: 0; right: 0; top: 858px; text-align: center; font-family: Vt; font-size: 30px; color: var(--dim); letter-spacing: 2px; }
  .src b { color: var(--ink); font-weight: 400; }

  /* scene A: bars */
  #base { left: 50px; right: 50px; top: 740px; height: 4px; background: var(--line); }
  .col { position: absolute; top: 0; width: 122px; height: 960px; }
  .bar { position: absolute; left: 15px; width: 92px; bottom: 220px; transform-origin: 50% 100%;
         background: repeating-linear-gradient(to bottom, var(--acc) 0 8px, #1FA86B 8px 10px); box-shadow: 0 0 26px rgba(61,245,160,.35); }
  .val { position: absolute; left: -20px; right: -20px; text-align: center; font-family: Vt; font-size: 50px; color: var(--ink); }
  .lg { position: absolute; left: 0; right: 0; top: 762px; height: 70px; display: flex; align-items: center; justify-content: center; }
  .lg img { height: 60px; max-width: 104px; filter: invert(1); }
  .lg .tx { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
  .ghost .bar { background: repeating-linear-gradient(to bottom, #5E7A6C 0 8px, #3C5246 8px 10px); box-shadow: none; }
  .ms { display: grid; grid-template-columns: 22px 22px; gap: 4px; }
  .ms i { width: 22px; height: 22px; background: var(--ink); display: block; }

  /* scene B: no-limit grid, then NVIDIA */
  .tile { position: absolute; width: 238px; height: 156px; background: var(--card); border: 3px solid var(--line);
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  .tile img { height: 58px; max-width: 150px; filter: invert(1); }
  .tile .nm { font-size: 22px; letter-spacing: 1px; color: var(--ink); }
  .tile .tx { font-size: 30px; font-weight: 700; }
  #stamp { left: 290px; top: 380px; width: 500px; height: 120px; background: var(--acc); color: var(--bg); font-weight: 700; font-size: 66px;
           display: flex; align-items: center; justify-content: center; gap: 18px; letter-spacing: 4px; box-shadow: 0 10px 0 #0B3A26, 0 0 60px rgba(61,245,160,.5); }
  #stamp .inf { font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 96px; line-height: 1; margin-top: -6px; }
  #nv { left: 0; right: 0; top: 150px; height: 640px; text-align: center; }
  #nv img { height: 120px; filter: invert(1); }
  #nvname { font-size: 44px; font-weight: 700; letter-spacing: 8px; margin-top: 14px; }
  #nvnum { font-family: Vt; font-size: 260px; line-height: .9; color: var(--acc); text-shadow: 0 0 40px rgba(61,245,160,.55); margin-top: 18px; }
  #nvsub { font-size: 32px; color: var(--dim); letter-spacing: 3px; margin-top: 10px; }
  #nvsub b { color: var(--ink); font-family: Vt; font-size: 42px; font-weight: 400; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1080" data-height="960">
  <div id="floor" class="clip" data-start="0" data-duration="25" data-track-index="0"></div>

  <div id="sA" class="clip" data-start="0" data-duration="13.8" data-track-index="1">
    <div id="aHd" class="abs hd" style="top:60px">TOKEN BUDGET</div>
    <div id="aSub" class="abs sub" style="top:132px">PER ENGINEER, EVERY MONTH</div>
    <div id="cols"></div>
    <div id="base" class="abs"></div>
    <div class="abs src">SOURCE: <b>THE INFORMATION</b></div>
  </div>

  <div id="sB" class="clip" data-start="13.8" data-duration="11.2" data-track-index="2">
    <div id="bHead">
      <div class="abs hd" style="top:60px">NO LIMIT SET</div>
      <div class="abs sub" style="top:132px">TOKEN BUDGET PER ENGINEER</div>
    </div>
    <div id="grid"></div>
    <div id="stamp" class="abs"><span class="inf">∞</span>UNLIMITED</div>
    <div id="nv" class="abs">
      <img src="assets/logos/nvidia.svg" alt="" />
      <div id="nvname">NVIDIA</div>
      <div id="nvnum">$<span id="nvk">0</span>K</div>
      <div id="nvsub">MAX A MONTH · RANGE <b>$35-50K</b></div>
    </div>
    <div class="abs src">SOURCE: <b>THE INFORMATION</b></div>
  </div>
</div>

<script>
  // ---------- data (The Information, "How much companies allow their engineers to spend on tokens a month") ----------
  // at = reveal time in this composition (reel word onset - 9.767 s for scene A, - 26.533 + 13.8 for scene B); null = never named -> stays blurred
  const BARS = [
    { k: 'workday',   tx: 'WORKDAY',   v: 300,   lab: '$100-300', at: null },
    { k: 'tesla',     v: 800,   at: 0.07 },
    { k: 'uber',      v: 2000,  at: 2.13 },
    { k: 'atlassian', v: 2000,  at: 4.45 },
    { k: 'rippling',  tx: 'RIPPLING', v: 2000, at: 4.95 },
    { k: 'autodesk',  v: 2500,  at: null },
    { k: 'apple',     v: 4000,  at: 8.79 },
    { k: 'microsoft', ms: true, v: 10000, at: 11.07 },
  ];
  const TILES = [
    { k: 'amazonwebservices', nm: 'AWS', at: null }, { k: 'anthropic', nm: 'ANTHROPIC', at: 14.87 },
    { k: 'blackstone', tx: 'BLACKSTONE', at: null }, { k: 'cognition', tx: 'COGNITION', at: 18.51 },
    { k: 'hubspot', nm: 'HUBSPOT', at: null }, { k: 'meta', nm: 'META', at: null },
    { k: 'openai', nm: 'OPENAI', at: 15.50 }, { k: 'oracle', nm: 'ORACLE', at: 16.82 },
    { k: 'palantir', nm: 'PALANTIR', at: null }, { k: 'replit', nm: 'REPLIT', at: 17.92 },
    { k: 'snowflake', nm: 'SNOWFLAKE', at: 16.16 },
  ];
  const T_UNLIM = 19.42, T_NV = 21.48, T_NUM = 23.36;
  const MAXH = 500, BASE = 740, X0 = 50, CW = 122.5;
  const fmt = v => v < 1000 ? '$' + Math.round(v) : '$' + (Math.round(v / 100) / 10) + 'K';   // $800, $2K, $2.5K, $10K: no labels touching

  // ---------- build DOM ----------
  const cols = document.getElementById('cols');
  BARS.forEach((b, i) => {
    const h = Math.max(8, b.v / 10000 * MAXH);
    const c = document.createElement('div'); c.className = 'col' + (b.at === null ? ' ghost' : ''); c.style.left = (X0 + i * CW) + 'px';
    const mark = b.ms ? '<div class="ms"><i></i><i></i><i></i><i></i></div>' : b.tx ? `<div class="tx">${b.tx}</div>` : `<img src="assets/logos/${b.k}.svg" alt="">`;
    c.innerHTML = `<div class="bar" style="height:${h}px"></div><div class="val" style="top:${BASE - h - 56}px">${b.lab || fmt(b.v)}</div><div class="lg">${mark}</div>`;
    cols.appendChild(c); b.el = c;
  });
  const grid = document.getElementById('grid');
  TILES.forEach((t, i) => {
    const r = Math.floor(i / 4), c = i % 4, n = r === 2 ? 3 : 4;
    const x = (1080 - (n * 238 + (n - 1) * 18)) / 2 + c * 256, y = 214 + r * 176;
    const d = document.createElement('div'); d.className = 'tile'; d.style.left = x + 'px'; d.style.top = y + 'px';
    d.innerHTML = t.tx ? `<div class="tx">${t.tx}</div>` : `<img src="assets/logos/${t.k}.svg" alt=""><div class="nm">${t.nm}</div>`;
    grid.appendChild(d); t.el = d;
  });

  // ---------- timeline ----------
  const tl = gsap.timeline({ paused: true });
  const BLUR = { filter: 'blur(14px)', opacity: 0.32 };
  const SHARP = { filter: 'blur(0px)', opacity: 1 };

  // scene A: everything sits blurred from frame 0; slow push the whole time
  tl.fromTo('#sA', { scale: 1 }, { scale: 1.035, duration: 13.8, ease: 'none', transformOrigin: '50% 60%' }, 0);
  tl.fromTo(['#aHd', '#aSub'], { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'power3.out', stagger: 0.06 }, 0);
  BARS.forEach(b => {
    const lg = b.el.querySelector('.lg'), bar = b.el.querySelector('.bar'), val = b.el.querySelector('.val');
    if (b.at === null) { tl.set([lg, bar, val], { filter: 'blur(8px)', opacity: 0.28 }, 0); return; }
    tl.set(lg, BLUR, 0); tl.set(bar, { scaleY: 0 }, 0); tl.set(val, { opacity: 0 }, 0);
    tl.to(lg, { ...SHARP, duration: 0.35, ease: 'power2.out' }, b.at);
    tl.fromTo(lg, { scale: 1.25 }, { scale: 1, duration: 0.3, ease: 'back.out(2)' }, b.at);
    tl.to(bar, { scaleY: 1, duration: b.v >= 10000 ? 0.7 : 0.45, ease: 'power3.out' }, b.at + 0.12);
    const o = { v: 0 };
    tl.to(o, { v: b.v, duration: b.v >= 10000 ? 0.7 : 0.45, ease: 'power3.out', onUpdate: () => { val.textContent = fmt(o.v); } }, b.at + 0.12);
    tl.fromTo(val, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.2, ease: 'power2.out' }, b.at + 0.12);
  });
  // Microsoft lands hard: small kick on the whole chart
  tl.fromTo('#cols', { y: 0 }, { y: 6, duration: 0.06, yoyo: true, repeat: 3, ease: 'none' }, 11.07 + 0.8);

  // scene B
  tl.fromTo('#sB', { scale: 1 }, { scale: 1.03, duration: 11.2, ease: 'none', transformOrigin: '50% 50%' }, 13.8);
  tl.set('#stamp', { opacity: 0 }, 0); tl.set('#nv', { opacity: 0 }, 0);
  tl.fromTo('#bHead', { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'power3.out' }, 13.8);
  TILES.forEach((t, i) => {
    tl.fromTo(t.el, { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: 'power3.out' }, 13.8 + 0.1 + i * 0.03);
    const inner = Array.from(t.el.children);
    tl.set(inner, t.at === null ? { filter: 'blur(9px)', opacity: 0.3 } : BLUR, 13.8);
    if (t.at === null) return;
    tl.to(inner, { ...SHARP, duration: 0.35, ease: 'power2.out' }, t.at);
    tl.to(t.el, { borderColor: '#3DF5A0', duration: 0.15 }, t.at);
    tl.fromTo(t.el, { scale: 1.12 }, { scale: 1, duration: 0.3, ease: 'back.out(2.4)' }, t.at);
  });
  tl.fromTo('#stamp', { scale: 1.7, rotation: -14, opacity: 0 }, { scale: 1, rotation: -6, opacity: 1, duration: 0.28, ease: 'back.out(2.2)' }, T_UNLIM);
  // NVIDIA: the grid steps back, NVIDIA takes the frame
  tl.to(['#grid', '#stamp', '#bHead'], { opacity: 0.08, filter: 'blur(6px)', duration: 0.35, ease: 'power2.out' }, T_NV);
  tl.fromTo('#nv', { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: 'power3.out' }, T_NV);
  tl.set('#nvnum', { opacity: 0 }, 0); tl.set('#nvsub', { opacity: 0 }, 0);
  tl.fromTo('#nvnum', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2)' }, T_NUM - 0.05);
  const nk = { v: 0 };
  tl.to(nk, { v: 50, duration: 0.5, ease: 'power3.out', onUpdate: () => { document.getElementById('nvk').textContent = Math.round(nk.v); } }, T_NUM - 0.05);
  tl.fromTo('#nvsub', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out' }, T_NUM + 0.35);
  tl.set({}, {}, 25);

  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = tl;
</script>
</body>
</html>
